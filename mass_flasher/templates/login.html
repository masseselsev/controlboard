<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mass Flasher Login</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: #d4d4d4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background-color: #252526;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            width: 300px;
            text-align: center;
            border: 1px solid #333;
        }
        h2 { margin-top: 0; color: #fff; }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background-color: #333;
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input:focus { outline: none; border-color: #007acc; }
        .btn {
            width: 100%;
            padding: 10px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn-login { background-color: #007acc; color: white; }
        .btn-login:hover { background-color: #005a9e; }
        .btn-register { background-color: #3e3e42; color: #d4d4d4; }
        .btn-register:hover { background-color: #4e4e52; }
        .error { color: #f48771; font-size: 0.9em; margin-bottom: 15px; }
        .success { color: #50fa7b; font-size: 0.9em; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Mass Flasher</h2>
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        <div id="message" class="success" style="display:none;"></div>

        <form method="POST" action="/login">
            <input type="text" name="username" id="username" placeholder="Username" required>
            <input type="password" name="password" id="password" placeholder="Password" required>
            <button type="submit" class="btn btn-login">Login</button>
        </form>
        
        <button onclick="register()" class="btn btn-register">Register</button>
    </div>

    <script>
        function register() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            
            if (!user || !pass) {
                alert("Please enter Username and Password to register.");
                return;
            }
            
            fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}`
            })
            .then(res => res.json())
            .then(data => {
                if (data.error) alert(data.error);
                else {
                    const msg = document.getElementById('message');
                    msg.textContent = "User created! You can now login.";
                    msg.style.display = 'block';
                }
            });
        }
    </script>
</body>
</html>
