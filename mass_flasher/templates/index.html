<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mass Flasher | VSM2 Control v2</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #bb86fc;
            --success-color: #03dac6;
            --error-color: #cf6679;
            --input-bg: #2d2d2d;
            --border-color: #333;
            --tab-active-bg: #333;
            --tab-inactive-bg: #1a1a1a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        h1,
        h2 {
            margin-top: 0;
            color: var(--accent-color);
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        textarea,
        button {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-color);
            box-sizing: border-box;
            font-family: monospace;
        }

        button {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button.secondary {
            background-color: #444;
            color: var(--text-color);
        }

        /* Tabs Styles */
        .tabs-header {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        .tab-btn {
            background-color: var(--tab-inactive-bg);
            color: #888;
            border: 1px solid var(--border-color);
            border-radius: 4px 4px 0 0;
            padding: 8px 10px 8px 15px;
            cursor: pointer;
            font-size: 0.9em;
            flex-grow: 0;
            width: auto;
            margin-bottom: 0;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn:hover {
            background-color: #252525;
        }

        .tab-btn.active {
            background-color: var(--tab-active-bg);
            color: var(--accent-color);
            border-bottom: 1px solid var(--tab-active-bg);
            font-weight: bold;
        }

        .close-tab {
            font-size: 1.1em;
            line-height: 0.8;
            color: #666;
            border-radius: 50%;
            padding: 0 4px;
            transition: color 0.2s, background-color 0.2s;
        }

        .close-tab:hover {
            color: var(--error-color);
            background-color: rgba(255, 255, 255, 0.1);
        }

        .log-container {
            height: 400px;
            overflow-y: auto;
            background-color: #000;
            border: 1px solid var(--border-color);
            border-top: none;
            /* Merges with tab */
            padding: 10px;
            font-family: 'Consolas', 'Monaco', monospace;
            white-space: pre-wrap;
            font-size: 14px;
            display: none;
            /* Hidden by default */
        }

        .log-container.active {
            display: block;
        }

        .log-entry {
            margin-bottom: 2px;
        }

        .log-time {
            color: #888;
            margin-right: 10px;
        }

        .log-ip {
            color: var(--success-color);
            margin-right: 10px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.7);
            padding-top: 60px;
        }

        .modal-content {
            background-color: var(--card-bg);
            margin: 5% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 500px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h1>Mass Flasher Utility</h1>
                <button class="secondary" onclick="openSettings()" style="width:auto;">⚙️ Settings</button>
            </div>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div>
                    <label>Username</label>
                    <input type="text" id="username" value="user">
                </div>
                <div>
                    <label>Password</label>
                    <input type="password" id="password" value="admin">
                </div>
                <div style="grid-column: span 2;">
                    <label>SSH Port</label>
                    <input type="number" id="port" value="2222">
                </div>
            </div>

            <label>IP Addresses / Ranges</label>
            <div style="font-size: 0.8em; color: #888; margin-bottom: 5px;">
                Supported formats: <code>192.168.1.10</code>, <code>192.168.1.10-20</code>. Comma separated.
            </div>
            <textarea id="ipInput" rows="4" placeholder="192.168.0.10, 192.168.0.20-30, 10.8.0.5"></textarea>

            <button onclick="startFlash()">🚀 Start Mass Flash & Reboot</button>
        </div>

        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:flex-end;">
                <h2>Live Logs</h2>
                <div>
                    <button class="secondary" onclick="closeAllTabs()"
                        style="width:auto; font-size: 0.8em; padding: 5px 10px; margin-bottom: 5px; margin-right:5px;">Close
                        All Tabs</button>
                    <button class="secondary" onclick="clearLogs()"
                        style="width:auto; font-size: 0.8em; padding: 5px 10px; margin-bottom: 5px;">Clear Logs</button>
                </div>
            </div>

            <!-- Tabs Header -->
            <div id="tabs-header" class="tabs-header">
                <button class="tab-btn active" onclick="switchTab('all')">All</button>
            </div>

            <!-- Tabs Content -->
            <div id="tabs-content">
                <div id="log-all" class="log-container active">Initializing log stream...</div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <h2>Telegram Notification Settings</h2>
            <p style="font-size:0.9em; color:#aaa;">Secrets are saved on the server and never sent to devices.</p>

            <label>Bot Token</label>
            <input type="text" id="tel_token" placeholder="123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11">

            <label>Chat ID</label>
            <input type="text" id="tel_chat_id" placeholder="-1001234567890">

            <div style="display:flex; gap:10px;">
                <button onclick="saveSettings()">Save</button>
                <button class="secondary" onclick="closeSettings()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const tabsHeader = document.getElementById('tabs-header');
        const tabsContent = document.getElementById('tabs-content');
        let knownIps = new Set();
        let activeTab = 'all';

        // SSE Stream
        const eventSource = new EventSource('/stream');
        eventSource.onmessage = function (e) {
            const msg = e.data;

            // Log to 'All'
            appendLog('all', msg);

            // Extract IP: [HH:MM:SS] [IP] Message
            const match = msg.match(/^\[.*?\] \[(.*?)\]/);
            if (match) {
                const ip = match[1];
                if (ip !== 'SYSTEM' && !knownIps.has(ip)) {
                    createTab(ip);
                }
                if (ip !== 'SYSTEM') {
                    appendLog(ip, msg);
                }
            }
        };

        function createTab(ip) {
            knownIps.add(ip);
            const safeIp = ip.replace(/\./g, '-');

            // Create Button
            const btn = document.createElement('button');
            btn.className = 'tab-btn';
            btn.onclick = () => switchTab(safeIp);
            btn.id = `btn-${safeIp}`;

            // Tab Text
            const textSpan = document.createElement('span');
            textSpan.textContent = ip;
            btn.appendChild(textSpan);

            // Close Button
            const closeSpan = document.createElement('span');
            closeSpan.className = 'close-tab';
            closeSpan.innerHTML = '&times;';
            closeSpan.title = "Close Tab";
            closeSpan.onclick = (e) => closeTab(ip, e);
            btn.appendChild(closeSpan);

            tabsHeader.appendChild(btn);

            // Create Content Div
            const div = document.createElement('div');
            div.className = 'log-container';
            div.id = `log-${safeIp}`;
            tabsContent.appendChild(div);
        }

        function closeTab(ip, event) {
            if (event) event.stopPropagation();

            const safeIp = ip.replace(/\./g, '-');
            const btn = document.getElementById(`btn-${safeIp}`);
            const div = document.getElementById(`log-${safeIp}`);

            if (btn) btn.remove();
            if (div) div.remove();

            knownIps.delete(ip);

            // If closed tab was active, switch to all
            if (activeTab === safeIp) {
                switchTab('all');
            }
        }

        function closeAllTabs() {
            const ips = Array.from(knownIps);
            ips.forEach(ip => closeTab(ip, null));
            switchTab('all');
        }

        function switchTab(safeIp) {
            // Update buttons
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            let btnId = safeIp === 'all' ? 'all' : safeIp.replace(/\./g, '-');

            // Handle edge case where safeIp might come in raw or safe
            if (safeIp === 'all') {
                // Find button with text 'All' or just first one? No, logic is simpler.
                // The headers logic:
                // <button ... onclick="switchTab('all')">
                // <button ... onclick="switchTab('10-8-0-93')">
                const targetBtn = safeIp === 'all' ?
                    Array.from(tabsHeader.children).find(b => b.textContent === 'All') :
                    document.getElementById(`btn-${safeIp}`);

                if (targetBtn) targetBtn.classList.add('active');
            } else {
                const targetBtn = document.getElementById(`btn-${safeIp}`);
                if (targetBtn) targetBtn.classList.add('active');
            }

            // Update content visibility
            document.querySelectorAll('.log-container').forEach(d => d.classList.remove('active'));
            document.getElementById(`log-${safeIp}`).classList.add('active');

            activeTab = safeIp;
        }

        function appendLog(safeIp, msg) {
            safeIp = safeIp.replace(/\./g, '-');
            const container = document.getElementById(`log-${safeIp}`);
            if (container) {
                const div = document.createElement('div');
                div.className = 'log-entry';
                div.textContent = msg;
                container.appendChild(div);

                // Auto-scroll only if we are viewing this tab? Or always?
                // Usually convenient to always auto-scroll
                container.scrollTop = container.scrollHeight;
            }
        }

        function startFlash() {
            const ips = document.getElementById('ipInput').value;
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const port = document.getElementById('port').value;

            if (!ips) { alert("Please enter IP addresses"); return; }

            // Reset tabs on new run? Maybe optional.
            // For now, let's clear unknown tabs if the user clears logs manually.

            fetch('/flash', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ips: ips, username: user, password: pass, port: port })
            })
                .then(response => response.json())
                .then(data => {
                    if (data.error) alert("Error: " + data.error);
                    else console.log("Batch started:", data.count);
                })
                .catch(err => alert("Request failed: " + err));
        }

        function clearLogs() {
            // Clear content of all containers
            document.querySelectorAll('.log-container').forEach(c => c.innerHTML = '');
        }

        // Settings Logic matches previous...
        const modal = document.getElementById("settingsModal");

        function openSettings() {
            fetch('/settings')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('tel_token').value = data.telegram_token || '';
                    document.getElementById('tel_chat_id').value = data.telegram_chat_id || '';
                    modal.style.display = "block";
                });
        }

        function closeSettings() {
            modal.style.display = "none";
        }

        function saveSettings() {
            const token = document.getElementById('tel_token').value;
            const chatId = document.getElementById('tel_chat_id').value;

            const formData = new FormData();
            formData.append('telegram_token', token);
            formData.append('telegram_chat_id', chatId);

            fetch('/settings', {
                method: 'POST',
                body: formData
            })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'saved') {
                        closeSettings();
                        alert("Settings saved!");
                    }
                });
        }

        window.onclick = function (event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>

</body>

</html>
